# Shared config for all infointeractdsgn lecture decks.
# Per-lecture index.qmd files should now contain ONLY:  title: "..."
# Edit this file once; seed.sh symlinks it into every deck.
subtitle: "Information & Interaction Design"
author:
  - name: Mick McQuaid
    email: mcq@utexas.edu
    affiliations: University of Texas at Austin
date: last-modified
date-format: "DD MMM YYYY"
execute:
  echo: true
format:
  clean-revealjs:
    slide-number: false
    logo: quarto.png
    footer-logo-link: "https://quarto.org"
    sc-sb-title: false
    header-logo: iSchoolLogoLight.png
    header-logo-link: "https://ischool.utexas.edu"
    subtitle-as-header: false
    controls: true
    controls-layout: edges
filters:
  - reveal-header
  - autofade.lua
slide-level: 2
number-sections: false
engine: knitr
embed-resources: true
bibliography: master.bib
mainfont: Fira Sans
monofont: VictorMono Nerd Font
mathfont: Fira Math
menu:
  side: 'right'
css: "style.css"
